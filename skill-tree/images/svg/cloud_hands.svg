<clipPath id="card"><rect x="2" y="2" width="96" height="96" rx="16"/></clipPath></defs>
<rect x="2" y="2" width="96" height="96" rx="16" fill="url(#bgg)"/>
<rect x="2" y="2" width="96" height="96" rx="16" fill="url(#dots)"/>
