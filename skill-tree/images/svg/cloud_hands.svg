<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="云手">
<title>云手</title>
<defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fff" opacity="0.10"/></pattern>
<radialGradient id="bgg" cx="60%" cy="35%" r="75%"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#000000"/></radialGradient>
